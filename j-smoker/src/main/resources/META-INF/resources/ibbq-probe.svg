<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 20 260 170">
  <defs>
    <linearGradient id="iShaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="30%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="70%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="iHandle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="25%" stop-color="#333"/>
      <stop offset="50%" stop-color="#444"/>
      <stop offset="75%" stop-color="#333"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="iTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#777"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
  </defs>

  <g transform="rotate(80, 40, 110)">
    <!-- Wire (braided cable going up from handle) -->
    <path d="M40 42 Q40 30 36 22 Q30 10 24 4 Q18 -2 10 -2"
          fill="none" stroke="url(#wire)" stroke-width="3" stroke-linecap="round"/>
    <!-- Wire sheath at connector -->
    <ellipse cx="40" cy="44" rx="5" ry="3" fill="#444" stroke="#222" stroke-width="0.8"/>

    <!-- Handle body (cylindrical plug with strain relief) -->
    <rect x="32" y="44" width="16" height="30" rx="4" fill="url(#iHandle)" stroke="#111" stroke-width="1"/>

    <!-- Strain relief ridges -->
    <g stroke="#555" stroke-width="0.6" opacity="0.5">
      <line x1="34" y1="50" x2="46" y2="50"/>
      <line x1="34" y1="54" x2="46" y2="54"/>
      <line x1="34" y1="58" x2="46" y2="58"/>
      <line x1="34" y1="62" x2="46" y2="62"/>
      <line x1="34" y1="66" x2="46" y2="66"/>
    </g>

    <!-- Metal ferrule (handle to shaft transition) -->
    <rect x="35" y="74" width="10" height="8" rx="1.5" fill="#999" stroke="#777" stroke-width="0.8"/>

    <!-- Main shaft (thin stainless steel probe) -->
    <rect x="37" y="82" width="6" height="120" rx="1" fill="url(#iShaft)" stroke="#909090" stroke-width="0.5"/>

    <!-- Probe tip (pointed end) -->
    <path d="M37 202 L40 216 L43 202" fill="url(#iTip)" stroke="#707070" stroke-width="0.5"/>

    <!-- Subtle highlight on shaft -->
    <rect x="39" y="85" width="1.5" height="110" rx="0.5" fill="white" opacity="0.15"/>
  </g>
</svg>
