<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
  <defs>
    <!-- Smoker body gradient -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="50%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#2c1a12"/>
    </linearGradient>
    <!-- Firebox glow -->
    <radialGradient id="glow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#ff6f00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>
    <!-- Smoke blur -->
    <filter id="smokeBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Smoke plumes -->
  <g filter="url(#smokeBlur)" opacity="0.45">
    <path d="M60 68 Q66 48 56 30 Q48 14 56 -4" fill="none" stroke="#bdbdbd" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M60 68 Q66 48 56 30 Q48 14 56 -4;
                M60 68 Q52 48 62 30 Q70 14 60 -4;
                M60 68 Q66 48 56 30 Q48 14 56 -4"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0.5;0.25;0.5"/>
    </path>
    <path d="M80 72 Q88 50 78 32 Q70 16 80 0" fill="none" stroke="#bdbdbd" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M80 72 Q88 50 78 32 Q70 16 80 0;
                M80 72 Q72 50 82 32 Q90 16 80 0;
                M80 72 Q88 50 78 32 Q70 16 80 0"/>
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.4;0.2;0.4"/>
    </path>
    <path d="M100 66 Q108 46 98 28 Q90 12 100 -6" fill="none" stroke="#9e9e9e" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M100 66 Q108 46 98 28 Q90 12 100 -6;
                M100 66 Q92 46 102 28 Q110 12 100 -6;
                M100 66 Q108 46 98 28 Q90 12 100 -6"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.35;0.15;0.35"/>
    </path>
    <path d="M44 64 Q50 44 42 26 Q36 10 44 -8" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" dur="3.8s" repeatCount="indefinite"
        values="M44 64 Q50 44 42 26 Q36 10 44 -8;
                M44 64 Q38 44 46 26 Q52 10 44 -8;
                M44 64 Q50 44 42 26 Q36 10 44 -8"/>
    </path>
  </g>

  <!-- Chimney / smokestack -->
  <rect x="72" y="58" width="16" height="18" rx="2" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <rect x="69" y="55" width="22" height="6" rx="2" fill="#4e342e" stroke="#3e2723" stroke-width="1"/>

  <!-- Main barrel (big smoker!) -->
  <ellipse cx="80" cy="100" rx="62" ry="30" fill="url(#body)" stroke="#1b0e08" stroke-width="2.5"/>

  <!-- Barrel bands -->
  <ellipse cx="80" cy="100" rx="62" ry="30" fill="none" stroke="#5d4037" stroke-width="1" opacity="0.5"/>
  <path d="M30 86 Q80 78 130 86" fill="none" stroke="#6d4c41" stroke-width="1.5" opacity="0.4"/>
  <path d="M30 114 Q80 122 130 114" fill="none" stroke="#6d4c41" stroke-width="1.5" opacity="0.4"/>

  <!-- Lid seam line -->
  <path d="M18 100 Q80 92 142 100" fill="none" stroke="#1b0e08" stroke-width="1.5"/>

  <!-- Handle on lid -->
  <rect x="68" y="67" width="24" height="5" rx="2.5" fill="#795548" stroke="#4e342e" stroke-width="1"/>

  <!-- Temperature gauge on front -->
  <circle cx="80" cy="96" r="8" fill="#212121" stroke="#757575" stroke-width="1"/>
  <circle cx="80" cy="96" r="5.5" fill="#1b1b1b"/>
  <line x1="80" y1="96" x2="83" y2="92" stroke="#ff5722" stroke-width="1" stroke-linecap="round">
    <animate attributeName="x2" dur="6s" repeatCount="indefinite" values="83;77;83"/>
    <animate attributeName="y2" dur="6s" repeatCount="indefinite" values="92;93;92"/>
  </line>

  <!-- Firebox (offset smaller box) -->
  <rect x="2" y="108" rx="4" ry="4" width="40" height="32" fill="url(#body)" stroke="#1b0e08" stroke-width="2"/>
  <!-- Firebox connection pipe -->
  <rect x="36" y="106" width="12" height="14" fill="#3e2723" stroke="#1b0e08" stroke-width="1.5"/>

  <!-- Fire glow inside firebox -->
  <ellipse cx="22" cy="128" rx="16" ry="10" fill="url(#glow)">
    <animate attributeName="rx" dur="1.5s" repeatCount="indefinite" values="16;14;16"/>
    <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="1;0.7;1"/>
  </ellipse>

  <!-- Firebox door -->
  <rect x="8" y="114" rx="2" ry="2" width="28" height="20" fill="none" stroke="#5d4037" stroke-width="1.5"/>
  <!-- Door handle -->
  <circle cx="32" cy="124" r="2" fill="#795548" stroke="#4e342e" stroke-width="0.8"/>

  <!-- Firebox vent holes -->
  <g fill="#ff8f00" opacity="0.6">
    <circle cx="14" cy="132" r="1.5">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.6;0.2;0.6"/>
    </circle>
    <circle cx="19" cy="132" r="1.5">
      <animate attributeName="opacity" dur="1.7s" repeatCount="indefinite" values="0.5;0.3;0.5"/>
    </circle>
    <circle cx="24" cy="132" r="1.5">
      <animate attributeName="opacity" dur="2.3s" repeatCount="indefinite" values="0.7;0.2;0.7"/>
    </circle>
  </g>

  <!-- Legs -->
  <g stroke="#1b0e08" stroke-width="3" stroke-linecap="round">
    <line x1="38" y1="128" x2="32" y2="155"/>
    <line x1="120" y1="128" x2="126" y2="155"/>
    <line x1="60" y1="130" x2="56" y2="155"/>
    <line x1="100" y1="130" x2="104" y2="155"/>
  </g>
  <!-- Leg feet -->
  <g fill="#3e2723">
    <ellipse cx="32" cy="156" rx="4" ry="2"/>
    <ellipse cx="126" cy="156" rx="4" ry="2"/>
    <ellipse cx="56" cy="156" rx="4" ry="2"/>
    <ellipse cx="104" cy="156" rx="4" ry="2"/>
  </g>

  <!-- Shelf below -->
  <line x1="40" y1="145" x2="118" y2="145" stroke="#5d4037" stroke-width="2"/>
  <line x1="40" y1="148" x2="118" y2="148" stroke="#5d4037" stroke-width="1.5" opacity="0.6"/>
</svg>
