<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 20 260 170">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="30%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="70%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="25%" stop-color="#454545"/>
      <stop offset="50%" stop-color="#555555"/>
      <stop offset="75%" stop-color="#454545"/>
      <stop offset="100%" stop-color="#2c2c2c"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <radialGradient id="led" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66ff66"/>
      <stop offset="60%" stop-color="#22cc22"/>
      <stop offset="100%" stop-color="#118811"/>
    </radialGradient>
  </defs>

  <g transform="rotate(80, 40, 100)">
    <!-- Probe tip (pointed end) -->
    <path d="M36 180 L40 195 L44 180" fill="url(#tip)" stroke="#707070" stroke-width="0.5"/>

    <!-- Main shaft (thin stainless steel probe) -->
    <rect x="36" y="60" width="8" height="120" rx="1" fill="url(#shaft)" stroke="#909090" stroke-width="0.5"/>

    <!-- Ceramic/metal transition ring -->
    <rect x="34" y="56" width="12" height="8" rx="2" fill="#888" stroke="#666" stroke-width="0.8"/>

    <!-- Handle body (thicker section with electronics) -->
    <rect x="30" y="10" width="20" height="48" rx="6" fill="url(#handle)" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Top cap (rounded) -->
    <path d="M30 16 Q30 4 40 4 Q50 4 50 16" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1"/>

    <!-- LED indicator -->
    <circle cx="40" cy="18" r="2.5" fill="url(#led)">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;0.3;1"/>
    </circle>

    <!-- Subtle handle grip lines -->
    <g stroke="#666" stroke-width="0.5" opacity="0.4">
      <line x1="33" y1="28" x2="47" y2="28"/>
      <line x1="33" y1="32" x2="47" y2="32"/>
      <line x1="33" y1="36" x2="47" y2="36"/>
      <line x1="33" y1="40" x2="47" y2="40"/>
      <line x1="33" y1="44" x2="47" y2="44"/>
    </g>

    <!-- Wireless signal arcs -->
    <g fill="none" stroke="#22cc22" stroke-width="1" stroke-linecap="round" opacity="0.5">
      <path d="M54 10 Q60 6 54 2">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.5;0.1;0.5"/>
      </path>
      <path d="M58 13 Q67 6 58 -1">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.1;0.5;0.1"/>
      </path>
    </g>
  </g>
</svg>
